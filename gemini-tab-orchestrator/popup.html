<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; font-family: system-ui, sans-serif; padding: 12px; background: #0f172a; color: #f8fafc; margin: 0; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; }
    select, input[type="text"], button { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 10px; color: #cbd5e1; cursor: pointer; }
    .checkbox-row input { margin: 0; cursor: pointer; }
    button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .copy-btn { background: #4f46e5; margin-top: 2px; font-size: 12px; }
    .registry { font-size: 12px; background: #1e293b; padding: 8px; border-radius: 6px; margin-top: 8px; }
    .role-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <h3>⚡ Gemini Multi-Agent Hub</h3>
  
  <label style="font-size:12px;">Assign Current Tab Role:</label>
  <select id="roleSelect">
    <option value="NONE">-- Unassigned --</option>
    <option value="MASTER">👑 MASTER (Orchestrator)</option>
    <option value="CODER">💻 CODER (Worker)</option>
    <option value="RESEARCHER">🔍 RESEARCHER (Worker)</option>
    <option value="CRITIC">🛡️ CRITIC / RED-TEAM (Worker)</option>
    <option value="CUSTOM">✏️ Custom Role...</option>
  </select>

  <input type="text" id="customRole" placeholder="Enter custom role (e.g. QUANT)" style="display:none;" />

  <label class="checkbox-row">
    <input type="checkbox" id="autoInitCheck" checked />
    Auto-inject Role System Prompt on bind
  </label>

  <button id="saveBtn">Bind & Initialize Tab</button>
  <button id="copyMasterPrompt" class="copy-btn">📋 Copy Master Prompt Manually</button>

  <div class="registry">
    <strong>Active Connected Tabs:</strong>
    <div id="registryList" style="margin-top:6px;">None</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
